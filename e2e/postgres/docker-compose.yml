networks:
  e2eNet:
    name: gaible-e2e-net

services:
  e2ePostgres:
    image: pgvector/pgvector:pg16
    container_name: gaible-e2e-postgres
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=gaible
    networks:
      - e2eNet
