services:
  gaible-frontend:
    image: ghcr.io/surt91/gaible/frontend:latest
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "3333:3080"
    depends_on:
      gaible-backend:
        condition: service_started

  gaible-backend:
    image: ghcr.io/surt91/gaible/backend:latest
    hostname: gaible-backend
    environment:
      AUTH_ENABLE_PASSWORD: true
      BASE_URL: http://localhost:3333
      AUTH_INITIAL_ADMIN_USERNAME: admin@example.com
      AUTH_INITIAL_ADMIN_PASSWORD: secret
      DB_URL: postgres://admin:secret@postgres:5432/gaible
      NODE_ENV: dev
      SESSION_SECRET: random
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --spider --tries=1 http://localhost:3000/api/health || exit 1
      interval: 1s
      timeout: 1s
      retries: 100

  gaible-reis:
    image: ghcr.io/surt91/gaible/reis:latest
    hostname: reis
    environment:
      EMBEDDINGS_TYPE: ollama
      EMBEDDINGS_OLLAMA_ENDPOINT: http://ollama:11434
      EMBEDDINGS_OLLAMA_MODEL_NAME: all-minilm
      STORE_TYPE: pgvector
      STORE_PGVECTOR_URL: postgresql+psycopg://admin:secret@postgres:5432/gaible
      STORE_PGVECTOR_INDEX_NAME: basisreistest
      FILE_STORE_TYPE: s3
      FILE_STORE_S3_ENDPOINT_URL: http://minio:9000
      FILE_STORE_S3_ACCESS_KEY_ID: admin
      FILE_STORE_S3_SECRET_ACCESS_KEY: secretsecret
      FILE_STORE_S3_BUCKET_NAME: reisbucket
    depends_on:
      ollama:
        condition: service_healthy
      ollama-models-pull:
        condition: service_completed_successfully
    healthcheck:
      # debian slim based image has no curl/wget
      test: python3 -c "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://localhost:3201/health').status == 200 else sys.exit(1)" || exit 2
      interval: 1s
      timeout: 1s
      retries: 20

  ollama:
    image: ollama/ollama:0.32.14
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  ollama-models-pull:
    image: curlimages/curl:8.21.0
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      curl -X POST ollama:11434/api/pull -d '{"name" : "llama3.2"}'
        --next -X POST ollama:11434/api/pull -d '{"name" : "all-minilm"}'

  postgres:
    image: pgvector/pgvector:pg16
    hostname: postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=gaible
      - PGPORT=5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d gaible" ]
      interval: 1s
      timeout: 1s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    hostname: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=secretsecret
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  ollama-data:
  postgres-data:
  minio-data:
