# The one way to run Gaible locally (and in CI for the E2E tests).
#
#   docker compose up --build                     # core stack on http://localhost:3333
#   docker compose --profile ollama up --build    # + local Ollama LLM/embeddings (CPU, slow)
#   docker compose --profile mcp up --build       # + example MCP server (mcp-server-fetch)
#   docker compose --profile eval up --build      # + eval service (set EVAL_SERVICE_ENABLED=true)
#
# Without --build, Compose pulls the published images (tag: GAIBLE_TAG, default `latest`)
# and only builds those it cannot pull.
# Every ${VAR:-default} can be overridden via the shell or a `.env` file next to this file.
# For hot-reload development start only the infrastructure (`docker compose up postgres s3 reis`)
# and run backend/frontend natively, see DEVELOPERS.md.

name: gaible

x-pg: &pg
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: secret
  POSTGRES_DB: gaible

x-s3: &s3
  FILE_STORE_TYPE: s3
  FILE_STORE_S3_ENDPOINT_URL: http://s3:9090
  FILE_STORE_S3_ACCESS_KEY_ID: admin
  FILE_STORE_S3_SECRET_ACCESS_KEY: secretsecret

services:
  frontend:
    image: ghcr.io/surt91/gaible/frontend:${GAIBLE_TAG:-latest}
    build:
      context: frontend
      args:
        VERSION: ${VERSION:-dev}
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${FRONTEND_PORT:-3333}:3080"
    depends_on:
      - backend

  backend:
    image: ghcr.io/surt91/gaible/backend:${GAIBLE_TAG:-latest}
    build: backend
    environment:
      BASE_URL: http://localhost:${FRONTEND_PORT:-3333}
      NODE_ENV: ${NODE_ENV:-production}
      VERSION: ${VERSION:-dev}
      DB_URL: postgres://admin:secret@postgres:5432/gaible
      SESSION_SECRET: ${SESSION_SECRET:-random}
      AUTH_ENABLE_PASSWORD: "true"
      AUTH_INITIAL_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@example.com}
      AUTH_INITIAL_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-secret}
      EVAL_SERVICE_ENABLED: ${EVAL_SERVICE_ENABLED:-false}
      EVAL_SERVICE_URL: http://eval:3202
      EVAL_SERVICE_ACCOUNT_API_KEY: ${EVAL_SERVICE_ACCOUNT_API_KEY:-}
    extra_hosts:
      # lets the backend reach services on the host, e.g. the mock LLM of the E2E tests
      - host.docker.internal:host-gateway
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --spider --tries=1 http://localhost:3000/api/health || exit 1
      interval: 2s
      timeout: 2s
      retries: 60

  reis:
    image: ghcr.io/surt91/gaible/reis:${GAIBLE_TAG:-latest}
    build:
      context: services/reis
    environment:
      <<: *s3
      FILE_STORE_S3_BUCKET_NAME: reisbucket
      VERSION: ${VERSION:-dev}
      WORKERS: ${REIS_WORKERS:-2}
      STORE_TYPE: pgvector
      STORE_PGVECTOR_URL: postgresql+psycopg://admin:secret@postgres:5432/gaible
      STORE_PGVECTOR_INDEX_NAME: reis
      # use `random-test-embeddings` to run without any embedding model
      EMBEDDINGS_TYPE: ${REIS_EMBEDDINGS_TYPE:-ollama}
      EMBEDDINGS_OLLAMA_ENDPOINT: http://ollama:11434
      EMBEDDINGS_OLLAMA_MODEL_NAME: all-minilm
    ports:
      - "3201:3201"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      # the image has no curl/wget
      test: python3 -c "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3201/health').status == 200 else 1)"
      interval: 2s
      timeout: 2s
      retries: 60

  postgres:
    image: pgvector/pgvector:pg16
    environment: *pg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gaible"]
      interval: 1s
      timeout: 1s
      retries: 30

  # S3 compatible file store for REI-S and eval (any access key/secret is accepted)
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3-data:/s3mockroot

  # --- profile: ollama -------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.10
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  ollama-models-pull:
    image: curlimages/curl:8.23.0
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      curl -X POST ollama:11434/api/pull -d '{"name" : "llama3.2"}'
        --next -X POST ollama:11434/api/pull -d '{"name" : "all-minilm"}'

  # --- profile: mcp ----------------------------------------------------------
  mcp-fetch:
    image: ghcr.io/surt91/gaible/mcp-tool-as-server:${GAIBLE_TAG:-latest}
    build: dev/mcp-tool-as-server
    profiles: [mcp]
    environment:
      CONFIG: '{"mcpServers":{"mcp-fetch":{"command":"uvx","args":["mcp-server-fetch","--ignore-robots-txt"],"port":8000}}}'
    ports:
      - "8000:8000"

  # --- profile: eval ---------------------------------------------------------
  eval: &eval
    image: ghcr.io/surt91/gaible/eval:${GAIBLE_TAG:-latest}
    build: services/eval
    profiles: [eval]
    environment: &eval-env
      <<: *s3
      FILE_STORE_S3_BUCKET_NAME: evalbucket
      PG_HOST: postgres
      PG_USER: admin
      PG_PASSWORD: secret
      PG_DB: gaible
      PG_PORT: 5432
      PG_SCHEMA: llm_eval
      CELERY_BROKER_HOST: rabbitmq
      CELERY_BROKER_USER: rabbit
      CELERY_BROKER_PASSWORD: rabbit
      LLM_EVAL_ENCRYPTION_KEY: ${LLM_EVAL_ENCRYPTION_KEY:-}
      GAIBLE_BACKEND_URL: http://backend:3000/api
      GAIBLE_BACKEND_API_KEY: ${EVAL_SERVICE_ACCOUNT_API_KEY:-}
    ports:
      - "3202:3202"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  eval-worker:
    <<: *eval
    environment: *eval-env
    ports: []
    healthcheck:
      disable: true
    command: celery -A llm_eval.tasks worker --loglevel=info --pool=solo

  rabbitmq:
    image: rabbitmq:4.4-management
    profiles: [eval]
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  s3-data:
  ollama-data:
