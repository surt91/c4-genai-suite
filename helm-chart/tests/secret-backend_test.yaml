# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json

suite: Secret Backend
templates:
  - secret-backend.yaml
tests:
  - it: is of kind Secret
    asserts:
      - isKind:
          of: Secret

  - it: uses default name pattern when no overrides are specified
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gaible-backend

  - it: name should use fullnameOverride when provided
    set:
      fullnameOverride: my-custom-fullname
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-fullname-backend

  - it: should incorporate nameOverride when provided
    set:
      nameOverride: my-custom-name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-my-custom-name-backend

  - it: contains the PostgreSQL connection string if set
    set:
      backend.postgresql.connectionString: postgres://user:password@host:port/dbname
    asserts:
      - equal:
          path: stringData.DB_URL
          value: postgres://user:password@host:port/dbname

  - it: does not contain the PostgreSQL connection string if an existing secret is set
    set:
      backend.postgresql.connectionString: postgresql://username:password@host:5432/db
      backend.postgresql.existingConnectionStringSecret: my-connection-string-secret
    asserts:
      - notExists:
          path: stringData.DB_URL

  - it: contains the Microsoft tenant if the Microsoft login is enabled
    set:
      backend.auth.microsoftClientId: client
      backend.auth.microsoftClientSecret: secret
      backend.auth.microsoftTenant: 0b5c0e4c-1111-2222-3333-444455556666
    asserts:
      - equal:
          path: stringData.AUTH_MICROSOFT_TENANT
          value: 0b5c0e4c-1111-2222-3333-444455556666

  - it: does not need a Microsoft tenant if the Microsoft login is disabled
    asserts:
      - isKind:
          of: Secret

  - it: fails if the Microsoft login is enabled without a tenant
    set:
      backend.auth.microsoftClientId: client
      backend.auth.microsoftClientSecret: secret
    asserts:
      - failedTemplate:
          errorPattern: backend.auth.microsoftTenant must be set

  - it: fails if the Microsoft login is enabled with a multi-tenant value
    set:
      backend.auth.existingMicrosoftClientId: existing-secret
      backend.auth.microsoftTenant: Organizations
    asserts:
      - failedTemplate:
          errorPattern: backend.auth.microsoftTenant must be set

  - it: does not check a tenant from an existing secret
    set:
      backend.auth.microsoftClientId: client
      backend.auth.existingMicrosoftTenant: existing-secret
    asserts:
      - notExists:
          path: stringData.AUTH_MICROSOFT_TENANT
