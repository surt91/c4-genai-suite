# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json

suite: ConfigMap Backend
templates:
  - configmap-backend.yaml
tests:
  - it: is of kind ConfigMap
    asserts:
      - isKind:
          of: ConfigMap

  - it: uses default name pattern when no overrides are specified
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-gaible-backend

  - it: name should use fullnameOverride when provided
    set:
      fullnameOverride: my-custom-fullname
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-fullname-backend

  - it: should incorporate nameOverride when provided
    set:
      nameOverride: my-custom-name
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-my-custom-name-backend

  - it: does not set a default REI-S endpoint when REI-S is disabled
    asserts:
      - notExists:
          path: data.REIS_DEFAULT_ENDPOINT

  - it: uses the REI-S service of the chart as default REI-S endpoint when REI-S is enabled
    set:
      reis.enabled: true
    asserts:
      - equal:
          path: data.REIS_DEFAULT_ENDPOINT
          value: http://RELEASE-NAME-gaible-reis

  - it: uses the configured default REI-S endpoint
    set:
      reis.enabled: true
      backend.reisDefaultEndpoint: http://external-reis:3201
    asserts:
      - equal:
          path: data.REIS_DEFAULT_ENDPOINT
          value: http://external-reis:3201
