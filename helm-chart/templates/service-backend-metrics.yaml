{{- if and .Values.backend.enabled .Values.backend.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gaible.fullname" . }}-backend-metrics
  labels:
    {{- include "gaible.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend-metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.backend.metrics.port }}
      targetPort: metrics
  selector:
    {{- include "gaible.commonSelectors" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
