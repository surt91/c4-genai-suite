{{- if and .Values.reis.enabled .Values.reis.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gaible.fullname" . }}-reis-metrics
  labels:
    {{- include "gaible.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: reis-metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.reis.metrics.port }}
      targetPort: metrics
  selector:
    {{- include "gaible.commonSelectors" . | nindent 4 }}
    app.kubernetes.io/component: reis
{{- end }}
