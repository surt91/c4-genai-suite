{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gaible.fullname" . }}-backend
  labels:
    {{- include "gaible.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: web
      port: 80
      targetPort: web
  selector:
    {{- include "gaible.commonSelectors" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
