{{- if and .Values.backend.enabled .Values.backend.metrics.prometheusRule.enabled }}
kind: PrometheusRule
apiVersion: monitoring.coreos.com/v1
metadata:
  name: {{ include "gaible.fullname" . }}-backend
  labels:
    {{- include "gaible.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: Gaible
spec:
  groups:
    - name: gaible-alerts
      {{- if .Values.backend.metrics.prometheusRule.ruleGroupLabels }}
      labels:
        {{- .Values.backend.metrics.prometheusRule.ruleGroupLabels | toYaml | nindent 8 }}
      {{- end }}
      rules:
        - alert: GaibleUnexpectedContainerRestart
          annotations:
            description: Pod container restarted {{`{{$labels.namespace}}`}}/{{`{{$labels.pod}}`}}/{{`{{$labels.container}}`}}
            summary: Gaible Container Restarted
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}", container="{{ include "gaible.fullname" . }}"}[30m]) > 0
          labels:
            severity: warning
{{- end }}
