{{- if .Values.reis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gaible.fullname" . }}-reis
  labels:
    {{- include "gaible.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: reis
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: web-deprecated
      port: 3201 # for backwards-compatibility
      targetPort: web
  selector:
    {{- include "gaible.commonSelectors" . | nindent 4 }}
    app.kubernetes.io/component: reis
{{- end }}
