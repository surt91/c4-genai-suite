{{- if .Values.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gaible.fullname" . }}-grafana-dashboards
  labels:
    {{- include "gaible.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-dashboards
    grafana_dashboard: "1"
data:
{{ (.Files.Glob "grafana-dashboards/*.json").AsConfig | indent 2 }}
{{- end }}
