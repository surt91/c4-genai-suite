{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gaible.fullname" . }}-frontend
  labels:
    {{- include "gaible.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    {{- include "gaible.commonSelectors" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
