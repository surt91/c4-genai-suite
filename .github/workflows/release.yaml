name: Release

# On every push to main:
#   - release-please maintains the release PR (version bump + CHANGELOG)
#   - container images are published as `main` and `commit-<sha>`
# When the release PR is merged, release-please creates the GitHub release and
# this workflow additionally publishes multi-arch images as `<version>`/`latest`
# and pushes the Helm chart.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/gaible

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Optional PAT: with the default GITHUB_TOKEN the CI workflow is not triggered on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  images:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: frontend, context: frontend }
          - { name: backend, context: backend }
          - { name: reis, context: services/reis }
          - { name: eval, context: services/eval }
          - { name: confluence-importer, context: services/confluence-importer }
          - { name: mcp-tool-as-server, context: dev/mcp-tool-as-server }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        if: needs.release-please.outputs.created
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image="$REGISTRY/${{ matrix.image.name }}"
          tags="$image:main,$image:commit-${{ github.sha }}"
          if [ -n "${{ needs.release-please.outputs.created }}" ]; then
            tags="$tags,$image:${{ needs.release-please.outputs.version }},$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ needs.release-please.outputs.created && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: VERSION=${{ needs.release-please.outputs.version || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  helm-chart:
    needs: release-please
    if: needs.release-please.outputs.created
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.5
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          helm package helm-chart/
          helm push gaible-*.tgz "oci://$REGISTRY/charts"
