[project]
name = "REI-S"
version = "0.1.0"
description = ""
authors = [
    { name = "Gaible contributors" },
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12.0,<4.0"
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings>=2.16.1",
    "langchain-core>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-ollama>=0.3.10",
    "langchain-aws>=1.9.0",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "psycopg[binary]>=3.3.6",
    "fastapi[standard]==0.161.1",
    "azure-search-documents==11.6.0",
    "azure-identity==1.26.0",
    "pdfminer-six>=20260107",
    "pypdf>=6.21.2",
    "ffmpeg-python>=0.2.0",
    "python-oxmsg>=0.0.2",
    "aiofiles>=25.1.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "fastmcp>=3.4.4,<4",
    "mcp>=1.30.0,<2",
    "boto3>=1.43.118",
    "boto3-stubs[s3]>=1.43.118",
    "weasyprint>=70.0",
    "markdown>=3.11.2",
    "pygments>=2.21.0",
    "orjson>=3.13.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "ty==0.0.57",
    "pip==26.2.2",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-responses==0.6.0",
    "pytest-github-report==0.0.1",
    "pytest-error-for-skips==2.0.2",
    "faker==40.43.0",
    "responses==0.26.3",
]

[project.scripts]
dev = "rei_s.scripts:dev"
format = "rei_s.scripts:format_code"
generate-api-spec = "rei_s.scripts:generate_api_spec"
lint = "rei_s.scripts:lint"
test = "rei_s.scripts:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "def __repr__",
    ]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "N", "A", "B"]

[tool.ty.terminal]
error-on-warning = true
